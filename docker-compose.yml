version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # API Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-aggregator-api
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - payment-network

  # ---------------------------------------------------------------------------
  # PostgreSQL — local dev only (production uses Neon.tech)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: payment-aggregator-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgpassword}
      POSTGRES_DB: ${POSTGRES_DB:-payment_aggregator}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pguser}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payment-network

  # ---------------------------------------------------------------------------
  # Redis — local dev only (production uses Upstash)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: payment-aggregator-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payment-network

  # ---------------------------------------------------------------------------
  # Prometheus — scrapes metrics from the API
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: payment-aggregator-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    networks:
      - payment-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:

networks:
  payment-network:
    driver: bridge