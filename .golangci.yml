version: "2"

run:
  timeout: 5m
  go: '1.26'

formatters:
  enable:
    - gofmt  

linters:
  enable:
    - govet
    - ineffassign
    - staticcheck
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - fmt.*
        - io/ioutil.*
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: migrations/
        linters:
          - all