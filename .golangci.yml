version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - misspell
    - godot

linters-settings:
  errcheck:
    ignore: fmt:.*,io/ioutil:.*

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: migrations/
      linters:
        - all