run:
  timeout: 5m
  go: '1.26'

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - misspell
    - godot

linters-settings:
  errcheck:
    exclude-functions:
      - fmt.*
      - io/ioutil.*

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: migrations/
      linters:
        - all